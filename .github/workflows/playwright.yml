name: Playwright tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run UI tests
        run: npm run test:ui:qa
        env:
          CI: true

      - name: Run API tests
        run: npm run test:api:qa
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: npm run allureReport:generate

      - name: Upload Ortoni report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ortoni-report
          path: html-report/OrtoniHtmlReport.html
          if-no-files-found: warn

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
